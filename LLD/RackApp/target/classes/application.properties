spring.main.banner-mode=off
spring.sql.init.encoding=UTF-8
spring.jackson.serialization.write-dates-as-timestamps=false
management.endpoints.web.exposure.include=health,info,metrics,env,loggers

spring.datasource.url=jdbc:h2:mem:rackdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# gzip compression for HTTP responses
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,application/css
server.compression.min-response-size=1024
